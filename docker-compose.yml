version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: sagaflow-postgres
    environment:
      POSTGRES_DB: sagaflow
      POSTGRES_USER: sagaflow
      POSTGRES_PASSWORD: sagaflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8083:8083"
    depends_on:
      - postgres

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8084:8084"
    depends_on:
      - postgres

  orchestrator-service:
    build: ./orchestrator-service
    container_name: orchestrator-service
    ports:
      - "8082:8082"
    depends_on:
      - postgres

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    ports:
      - "8081:8081"
    depends_on:
      - postgres

volumes:
  postgres_data:
