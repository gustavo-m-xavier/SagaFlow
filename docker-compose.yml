version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: sagaflow-postgres
    environment:
      POSTGRES_DB: sagaflow
      POSTGRES_USER: sagaflow
      POSTGRES_PASSWORD: sagaflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sagaflow", "-d", "sagaflow"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8083:8083"
    depends_on:
      - postgres

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8084:8084"
    depends_on:
      - postgres

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    ports:
      - "8081:8081"
    depends_on:
      - postgres

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
#      Alterar quando for rodar via container, para o nome do serviço(kafka)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  liquibase:
    image: liquibase/liquibase:4.27
    container_name: liquibase
    volumes:
      - ./liquibase/liquibase.properties:/liquibase/liquibase.properties
      - ./liquibase/changelog:/liquibase/changelog
    command:
      - "--defaultsFile=/liquibase/liquibase.properties"
      - update
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sagaflow", "-d", "sagaflow"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
